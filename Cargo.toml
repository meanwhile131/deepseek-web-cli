[package]
name = "deepseek-web-cli"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/meanwhile131/deepseek-web-cli"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rustyline = "14"
rayon = "1.10"
hex = "0.4"
libc = "0.2"
futures-util = "0.3"
anyhow = "1"
async-stream = "0.3"
chrono = "0.4.45"
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
rusty-leveldb = "4.0.2"

[[bin]]
name = "deepseek"
path = "src/main.rs"

# cargo-binstall metadata: lets `cargo binstall deepseek-web-cli` fetch the
# prebuilt archive from the GitHub release instead of compiling from source.
# The release workflow publishes assets named
#   deepseek-<target>.tar.gz   (unix)
#   deepseek-<target>.zip      (windows)
# each containing the bare `deepseek` binary at the archive root, under a tag
# named `v<version>`.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.zip"
pkg-fmt = "zip"
bin-dir = "{ bin }{ binary-ext }"

[profile.release]
lto = true
codegen-units = 1
strip = true
