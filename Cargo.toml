[package]
name = "deepseek-web-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rustyline = "14"
rayon = "1.10"
hex = "0.4"
libc = "0.2"
futures-util = "0.3"
anyhow = "1"
async-stream = "0.3"
chrono = "0.4.45"

[[bin]]
name = "deepseek"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
