name: Release

# Binaries are built and released on every commit:
#   * push to main      -> a new release tagged `build-<sha>` for that commit,
#                          marked as the repository's Latest; old build
#                          releases beyond the newest KEEP are pruned
#   * push of a v* tag  -> versioned release `v<version>` (assets for cargo-binstall)
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Never let two runs publish to the same release concurrently.
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: deepseek-x86_64-unknown-linux-gnu.tar.gz
            binary: deepseek
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: deepseek-x86_64-pc-windows-msvc.zip
            binary: deepseek.exe
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd "target/${{ matrix.target }}/release"
          tar czf "$GITHUB_WORKSPACE/${{ matrix.archive }}" "${{ matrix.binary }}"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.binary }}" -DestinationPath "${{ matrix.archive }}"

      - name: Record commit
        shell: bash
        run: |
          {
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF_NAME"
            echo "target=${{ matrix.target }}"
          } > "${{ matrix.archive }}.commit.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.commit.txt
          if-no-files-found: error

  release:
    name: Publish ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List assets
        run: ls -lR artifacts

      # One release per commit to main: a fresh `build-<sha>` tag each time,
      # marked Latest once its assets are in place. Releases are immutable
      # records of a commit; only the newest KEEP of them are retained.
      - name: Publish release for this commit
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEEP: "10"
        run: |
          set -euo pipefail
          tag="build-${GITHUB_SHA:0:12}"
          short="${GITHUB_SHA:0:7}"
          title="Build ${short}"
          body="Binaries built from commit \`${GITHUB_SHA}\` on \`main\` at $(date -u +%Y-%m-%dT%H:%M:%SZ)."

          # Re-running a commit reuses its release; otherwise create a new one.
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$body"
          gh release edit "$tag" --title "$title" --notes "$body" \
            --prerelease=false --target "$GITHUB_SHA"
          gh release upload "$tag" artifacts/* --clobber
          # Mark latest only after the assets exist, so /releases/latest never
          # points at a half-populated release.
          gh release edit "$tag" --latest

          # Prune older per-commit releases (never v* tags or the current one).
          gh api --paginate "repos/${GH_REPO}/releases?per_page=100" \
            --jq '.[] | select(.tag_name | startswith("build-")) | [.tag_name, .created_at] | @tsv' \
            | sort -k2 -r \
            | tail -n +"$((KEEP + 1))" \
            | while IFS=$'\t' read -r old_tag _; do
                [ "$old_tag" = "$tag" ] && continue
                echo "Pruning $old_tag"
                gh release delete "$old_tag" --yes --cleanup-tag
              done

      # Versioned release for v* tags. `make_latest: false` keeps the "Latest"
      # marker on the per-commit build release, which is what
      # package.metadata.binstall resolves against.
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          make_latest: false
