name: Release

# Binaries are built on every commit:
#   * push to main      -> rolling pre-release tagged `latest` (assets replaced)
#   * push of a v* tag  -> versioned release `v<version>` (assets for cargo-binstall)
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Never let two runs publish to the same release concurrently.
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: deepseek-x86_64-unknown-linux-gnu.tar.gz
            binary: deepseek
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: deepseek-x86_64-pc-windows-msvc.zip
            binary: deepseek.exe
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd "target/${{ matrix.target }}/release"
          tar czf "$GITHUB_WORKSPACE/${{ matrix.archive }}" "${{ matrix.binary }}"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.binary }}" -DestinationPath "${{ matrix.archive }}"

      - name: Record commit
        shell: bash
        run: |
          {
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF_NAME"
            echo "target=${{ matrix.target }}"
          } > "${{ matrix.archive }}.commit.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.commit.txt
          if-no-files-found: error

  release:
    name: Publish ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List assets
        run: ls -lR artifacts

      # Rolling release, refreshed on every commit to main. It is a full
      # (non-prerelease) release so GitHub marks it as the repository's latest.
      # `--latest` is passed explicitly because GitHub otherwise refuses to
      # move the "latest" marker onto a release whose tag is not the newest
      # semver tag.
      - name: Publish rolling `latest` release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=latest
          short="${GITHUB_SHA:0:7}"
          title="Latest build ($short)"
          body="Rolling build of \`${GITHUB_SHA}\` from \`main\` on $(date -u +%Y-%m-%dT%H:%M:%SZ). Assets are replaced on every commit. This release always tracks the newest commit on \`main\`."
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$body"
          gh release edit "$tag" --title "$title" --notes "$body" --prerelease=false
          # Move the rolling tag onto this commit so the release page points at
          # the code the binaries were built from.
          gh api -X PATCH "repos/${GH_REPO}/git/refs/tags/${tag}" \
            -f sha="${GITHUB_SHA}" -F force=true >/dev/null
          gh release upload "$tag" artifacts/* --clobber
          # Mark it latest last, after assets are in place.
          gh release edit "$tag" --latest

      # Versioned release for v* tags; matches package.metadata.binstall.
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
